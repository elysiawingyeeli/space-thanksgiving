<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Space Thanksgiving</title>
<meta name="description" content="Send a gratitude transmission ✦">
<meta property="og:title" content="Space Thanksgiving ✦">
<meta property="og:description" content="Tap in, pick your agent name, and send a gratitude transmission.">
<meta name="theme-color" content="#07061a">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪐</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;1,9..144,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--void:#07061a;--deep:#120f33;--ink:#f6ecdc;--dim:#b9aecb;--amber:#ffb347;--pumpkin:#ff7a3d;--cran:#d6456b;--gold:#ffd88a;--teal:#6fe3d6;--glass:rgba(255,255,255,.055);--line:rgba(255,216,138,.22)}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--void);color:var(--ink);font-family:"Space Mono",monospace;min-height:100%}
  body{overflow-x:hidden}
  #sky{position:fixed;inset:0;z-index:0;pointer-events:none}
  .nebula{position:fixed;inset:-20%;z-index:0;pointer-events:none;background:radial-gradient(40% 35% at 20% 15%,rgba(214,69,107,.22),transparent 70%),radial-gradient(35% 30% at 85% 30%,rgba(255,122,61,.18),transparent 70%),radial-gradient(50% 40% at 50% 95%,rgba(111,227,214,.10),transparent 70%);filter:blur(10px);animation:drift 40s ease-in-out infinite alternate}
  @keyframes drift{to{transform:translate(3%,-2%) scale(1.05)}}
  main{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 32px) 16px 110px}

  header{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:18px}
  .planet{width:54px;height:54px;position:relative;flex:none}
  .planet .ball{position:absolute;inset:7px;border-radius:50%;background:radial-gradient(circle at 32% 30%,#ffe2a8,var(--amber) 35%,var(--pumpkin) 62%,#7a2414 100%);box-shadow:0 0 40px rgba(255,140,60,.55),inset -6px -8px 14px rgba(60,10,20,.55)}
  .planet .ring{position:absolute;left:-6px;right:-6px;top:50%;height:16px;margin-top:-8px;border-radius:50%;border:2px solid rgba(255,216,138,.65);transform:rotate(-18deg)}
  .planet .ring.front{clip-path:inset(50% 0 0 0)}
  h1{font-family:"Fraunces",serif;font-weight:300;font-size:clamp(32px,7vw,56px);letter-spacing:-.02em;line-height:1}
  h1 em{font-style:italic;font-weight:400;background:linear-gradient(90deg,var(--gold),var(--pumpkin),var(--cran));-webkit-background-clip:text;background-clip:text;color:transparent}

  .tabs{display:flex;gap:4px;margin:0 auto 24px;padding:5px;border:1px solid var(--line);border-radius:999px;background:rgba(18,15,51,.78);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);width:max-content;max-width:100%;position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:7}
  .tabs a{padding:9px 14px;border-radius:999px;color:var(--dim);text-decoration:none;font-size:11px;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
  .tabs a.on{background:linear-gradient(90deg,var(--gold),var(--pumpkin));color:#2a0d05;font-weight:700}
  .tab{display:none}.tab.on{display:block}
  .lead{text-align:center;color:var(--dim);font-size:14px;margin:0 auto 20px}

  .panel{max-width:620px;margin:0 auto 40px;padding:20px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(160deg,rgba(255,179,71,.07),rgba(18,15,51,.65));backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  label{display:block;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin:14px 0 6px}
  label:first-child{margin-top:0}
  input,textarea{width:100%;background:rgba(7,6,26,.6);border:1px solid rgba(255,255,255,.14);color:var(--ink);border-radius:12px;padding:12px 14px;font:inherit;font-size:16px;outline:none}
  textarea{min-height:100px;resize:vertical;font-family:"Fraunces",serif;font-size:18px;line-height:1.45}
  input:focus,textarea:focus{border-color:var(--amber);box-shadow:0 0 0 3px rgba(255,179,71,.18)}
  .agent{display:flex;gap:8px}
  .dice{flex:none;width:50px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:rgba(7,6,26,.6);font-size:22px;cursor:pointer}
  .planets{display:flex;flex-wrap:wrap;gap:6px}
  .pchip{display:flex;align-items:center;gap:6px;padding:7px 11px;border-radius:999px;border:1px solid rgba(255,255,255,.14);background:rgba(7,6,26,.5);cursor:pointer;font:12px "Space Mono",monospace;color:var(--ink)}
  .pchip i{width:11px;height:11px;border-radius:50%;display:block}
  .pchip[aria-pressed="true"]{border-color:var(--gold);background:rgba(255,216,138,.12)}
  .btn{display:block;width:100%;margin-top:18px;border:0;cursor:pointer;padding:15px;border-radius:999px;font:700 13px "Space Mono",monospace;letter-spacing:.18em;text-transform:uppercase;color:#2a0d05;background:linear-gradient(90deg,var(--gold),var(--pumpkin));box-shadow:0 8px 30px rgba(255,122,61,.35)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .status{margin-top:12px;font-size:12px;min-height:16px;color:var(--teal);text-align:center}
  .status.err{color:#ff9aa9}
  .beam{position:fixed;left:50%;bottom:0;width:4px;height:0;margin-left:-2px;z-index:5;pointer-events:none;background:linear-gradient(to top,transparent,var(--gold),#fff);box-shadow:0 0 24px 6px rgba(255,216,138,.6);border-radius:4px}
  .beam.go{animation:beam 1.1s ease-out forwards}
  @keyframes beam{0%{height:0;opacity:1}60%{height:110vh;opacity:1}100%{height:110vh;opacity:0;transform:translateY(-110vh)}}

  .wallhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px}
  .wallhead h2{font-family:"Fraunces",serif;font-weight:300;font-size:28px}
  .wallhead h2 em{font-style:italic;color:var(--amber)}
  .ghost{background:transparent;border:1px solid var(--line);color:var(--gold);padding:9px 16px;border-radius:999px;font:12px "Space Mono",monospace;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;text-decoration:none}
  .wall{columns:3 280px;column-gap:16px}
  .card{break-inside:avoid;margin:0 0 16px;padding:20px 20px 16px;border-radius:18px;position:relative;background:linear-gradient(165deg,rgba(255,255,255,.075),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.1);animation:land .6s cubic-bezier(.2,.8,.2,1) both}
  .card::after{content:"";position:absolute;top:-1px;left:20px;right:20px;height:2px;border-radius:2px;background:var(--c);box-shadow:0 0 14px var(--c)}
  @keyframes land{from{opacity:0;transform:translateY(14px)}}
  .card .orb{position:absolute;top:16px;right:16px;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff8,var(--c) 45%,#0006 100%);box-shadow:0 0 16px var(--c)}
  .card blockquote{font-family:"Fraunces",serif;font-size:19px;line-height:1.42;font-weight:300;padding-right:26px;white-space:pre-wrap;word-wrap:break-word}
  .card .meta{margin-top:14px;font-size:11px;letter-spacing:.08em;color:var(--dim)}
  .card .who{color:var(--ink);text-transform:uppercase;letter-spacing:.14em;margin-bottom:2px}
  .card .from{color:var(--c)}
  .empty{text-align:center;color:var(--dim);padding:44px 20px;border:1px dashed var(--line);border-radius:18px}

  .menu{max-width:620px;margin:0 auto;display:grid;gap:12px}
  .item{display:flex;align-items:center;gap:16px;padding:18px 20px;border-radius:18px;border:1px solid rgba(255,255,255,.1);background:linear-gradient(165deg,rgba(255,255,255,.075),rgba(255,255,255,.02))}
  .item .orb{width:14px;height:14px;border-radius:50%;flex:none;background:var(--c);box-shadow:0 0 12px var(--c)}
  .item .nm{font-family:"Fraunces",serif;font-size:21px}
  .item .tg{color:var(--gold);font-size:10px;letter-spacing:.14em;text-transform:uppercase;margin-top:6px;line-height:1.5}
  .item .nt{color:var(--dim);font-size:13px;margin-top:6px;line-height:1.5}
  .item{align-items:flex-start}.item .orb{margin-top:8px}

  .upload{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:26px;border:1.5px dashed var(--line);border-radius:16px;cursor:pointer;color:var(--gold);text-align:center;font-size:13px}
  .upload b{font-size:28px;line-height:1}
  .upload input{display:none}
  .preview{display:none;width:100%;max-height:300px;object-fit:contain;border-radius:12px;margin-top:12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .ph{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;border:1px solid rgba(255,255,255,.1);cursor:pointer;background:var(--deep);animation:land .6s both}
  .ph img{width:100%;height:100%;object-fit:cover;display:block}
  .ph span{position:absolute;left:0;right:0;bottom:0;padding:18px 10px 8px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;background:linear-gradient(transparent,rgba(7,6,26,.85))}
  .lightbox{position:fixed;inset:0;z-index:20;background:rgba(7,6,26,.95);display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:14px}
  .lightbox.on{display:flex}
  .lightbox img{max-width:100%;max-height:78vh;border-radius:12px}
  .lightbox p{font-family:"Fraunces",serif;font-size:18px;text-align:center}
  .lightbox small{color:var(--dim);letter-spacing:.14em;text-transform:uppercase;font-size:11px}

  .fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:6;padding:13px 22px;border-radius:999px;border:1px solid var(--line);background:rgba(18,15,51,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--gold);font:700 12px "Space Mono",monospace;letter-spacing:.16em;text-transform:uppercase;text-decoration:none;box-shadow:0 10px 30px rgba(0,0,0,.5);display:none}
  .fab.show{display:block}
  .setup{max-width:620px;margin:0 auto 24px;padding:16px;border-radius:14px;border:1px solid rgba(255,154,169,.35);background:rgba(214,69,107,.1);color:#ffd2d9;font-size:13px;line-height:1.55;display:none}

  /* Story mode */
  #tv{position:fixed;inset:0;z-index:10;display:none;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:calc(env(safe-area-inset-top,0px) + 70px) 26px calc(env(safe-area-inset-bottom,0px) + 70px);background:radial-gradient(ellipse at 50% 40%,rgba(18,15,51,.35),rgba(7,6,26,.92));user-select:none;-webkit-user-select:none}
  body.story #tv{display:flex} body.story main,body.story .fab{display:none}
  .bars{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);left:14px;right:14px;display:flex;gap:4px}
  .bars span{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.2);overflow:hidden}
  .bars span b{display:block;height:100%;width:0;background:var(--gold)}
  .bars span.done b{width:100%} .bars span.on b{animation:fill 7s linear forwards}
  @keyframes fill{to{width:100%}}
  #tvorb{width:64px;height:64px;border-radius:50%;margin-bottom:28px;transition:.6s}
  #tvq{font-family:"Fraunces",serif;font-weight:300;font-size:clamp(24px,7vw,44px);line-height:1.28;max-width:640px;transition:opacity .45s,transform .45s,filter .45s;word-wrap:break-word}
  #tvq.out{opacity:0;transform:translateY(-14px);filter:blur(5px)}
  #tvwho{margin-top:26px;font-size:12px;letter-spacing:.25em;text-transform:uppercase;transition:opacity .45s}
  #tvwho.out{opacity:0}
  #tvcount{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);left:0;right:0;font-size:10px;letter-spacing:.3em;color:var(--dim)}
  .tap{position:absolute;top:60px;bottom:60px;z-index:1;background:none;border:0;cursor:pointer}
  .tap.l{left:0;width:35%} .tap.r{right:0;width:65%}
  #tvexit{position:fixed;top:calc(env(safe-area-inset-top,0px) + 26px);right:14px;z-index:12;display:none;font-size:16px;padding:6px 12px}
  body.story #tvexit{display:block}
  @media (max-width:520px){.wall{columns:1}.card blockquote{font-size:18px}}
</style>
</head>
<body>
<canvas id="sky"></canvas><div class="nebula"></div><div class="beam" id="beam"></div>

<main>
  <header>
    <div class="planet" aria-hidden="true"><div class="ring"></div><div class="ball"></div><div class="ring front"></div></div>
    <h1>Space <em>Thanksgiving</em></h1>
  </header>
  <nav class="tabs">
    <a href="#" data-t="gratitude">Gratitude</a>
    <a href="#drinks" data-t="drinks">Drinks</a>
    <a href="#food" data-t="food">Food</a>
    <a href="#photos" data-t="photos">Photos</a>
  </nav>
  <div class="setup" id="setup"></div>

  <section id="tab-gratitude" class="tab">
    <p class="lead">What are you thankful for?</p>
    <form class="panel" id="gform" autocomplete="off">
      <label for="agent">Space agent name</label>
      <div class="agent"><input id="agent" maxlength="40" placeholder="Agent Cranberry Comet" required><button type="button" class="dice" data-dice title="Random name">🎲</button></div>
      <label for="msg">I'm grateful for…</label>
      <textarea id="msg" maxlength="280" placeholder="friends who orbit me wherever I drift" required></textarea>
      <label>Your planet</label>
      <div class="planets" id="planets"></div>
      <button class="btn" type="submit">Send ↑</button>
      <div class="status" id="gstatus"></div>
    </form>
    <div class="wallhead"><h2>The <em>wall</em></h2><a class="ghost" href="#stories">Play ✦</a></div>
    <div class="wall" id="wall"></div>
    <div class="empty" id="gempty">No signals yet. Be the first.</div>
  </section>

  <section id="tab-drinks" class="tab">
    <p class="lead">The Orbit Bar · 3 drinks + 1 mystery</p>
    <div class="menu" id="menu-drinks"></div>
  </section>

  <section id="tab-food" class="tab">
    <p class="lead">Tonight's feast.</p>
    <div class="menu" id="menu-food"></div>
  </section>

  <section id="tab-photos" class="tab">
    <p class="lead">Snap the mission.</p>
    <form class="panel" id="pform" autocomplete="off">
      <label class="upload" id="pick"><b>＋</b><span id="pickText">Add a photo</span><input type="file" id="file" accept="image/*"></label>
      <img class="preview" id="preview" alt="">
      <label for="pagent">Space agent name</label>
      <div class="agent"><input id="pagent" maxlength="40" placeholder="Agent Gravy Nebula" required><button type="button" class="dice" data-dice title="Random name">🎲</button></div>
      <label for="caption">Caption (optional)</label>
      <input id="caption" maxlength="120" placeholder="first contact with the pie">
      <button class="btn" type="submit" id="psend">Upload ↑</button>
      <div class="status" id="pstatus"></div>
    </form>
    <div class="grid" id="grid"></div>
    <div class="empty" id="pempty">No photos yet.</div>
  </section>
</main>

<div class="lightbox" id="lightbox"><img id="lbimg" alt=""><p id="lbcap"></p><small id="lbwho"></small></div>

<div id="tv">
  <div class="bars" id="bars"></div>
  <button class="tap l" id="prev" aria-label="Previous"></button>
  <button class="tap r" id="next" aria-label="Next"></button>
  <div id="tvorb"></div><div id="tvq">Waiting for the first signal…</div><div id="tvwho"></div><div id="tvcount"></div>
</div>
<a class="ghost" id="tvexit" href="#" aria-label="Close">✕</a>

<script src="config.js"></script>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const $ = id => document.getElementById(id);
const PLANETS=[["earth","Earth","#6fe3d6"],["mars","Mars","#ff7a3d"],["saturn","Saturn","#ffd88a"],["venus","Venus","#ffb3c7"],["jupiter","Jupiter","#e8a46b"],["neptune","Neptune","#7fa8ff"],["moon","The Moon","#e6e1f0"],["deep","Deep Space","#c48cff"]].map(([k,n,c])=>({k,n,c}));
const P=Object.fromEntries(PLANETS.map(p=>[p.k,p]));
const BUCKET="party-photos";
let chosen="earth",grats=[],menu=[],photos=[];

/* starfield */
(()=>{const cv=$("sky"),cx=cv.getContext("2d");let W,H,st=[],sh=null;const d=devicePixelRatio||1;
function size(){W=cv.width=innerWidth*d;H=cv.height=innerHeight*d;cv.style.width=innerWidth+"px";cv.style.height=innerHeight+"px";
st=Array.from({length:Math.min(400,innerWidth*innerHeight/2600|0)},()=>({x:Math.random()*W,y:Math.random()*H,r:(Math.random()*1.3+.2)*d,t:Math.random()*6.28,s:Math.random()*.02+.004,h:Math.random()<.15?"255,200,140":"255,255,255"}))}
function f(){cx.clearRect(0,0,W,H);for(const s of st){s.t+=s.s;cx.fillStyle=`rgba(${s.h},${.35+.65*Math.abs(Math.sin(s.t))})`;cx.beginPath();cx.arc(s.x,s.y,s.r,0,6.28);cx.fill()}
if(!sh&&Math.random()<.004)sh={x:Math.random()*W*.8,y:Math.random()*H*.4,l:0};
if(sh){sh.l+=14*d;const g=cx.createLinearGradient(sh.x,sh.y,sh.x+sh.l,sh.y+sh.l*.45);g.addColorStop(0,"rgba(255,216,138,0)");g.addColorStop(1,"rgba(255,240,210,.9)");cx.strokeStyle=g;cx.lineWidth=1.6*d;cx.beginPath();cx.moveTo(sh.x,sh.y);cx.lineTo(sh.x+sh.l,sh.y+sh.l*.45);cx.stroke();if(sh.l>380*d)sh=null}
requestAnimationFrame(f)}addEventListener("resize",size);size();f()})();

/* agent names */
const A1=["Cranberry","Gravy","Pumpkin","Stuffing","Pecan","Butter","Maple","Cinnamon","Turkey","Sweet Potato","Cosmic","Lunar","Solar","Stellar"];
const A2=["Comet","Nebula","Rocket","Pulsar","Quasar","Meteor","Orbit","Nova","Satellite","Galaxy","Moonbeam","Starship","Asteroid"];
const rnd=a=>a[Math.random()*a.length|0];
const randomAgent=()=>`Agent ${rnd(A1)} ${rnd(A2)}`;
function setAgent(v){$("agent").value=v;$("pagent").value=v;try{localStorage.setItem("agent",v)}catch(e){}}
document.querySelectorAll("[data-dice]").forEach(b=>b.onclick=()=>setAgent(randomAgent()));
["agent","pagent"].forEach(id=>$(id).addEventListener("change",e=>setAgent(e.target.value.trim())));
try{const a=localStorage.getItem("agent");if(a)setAgent(a)}catch(e){}

/* planet chips */
PLANETS.forEach(p=>{const b=document.createElement("button");b.type="button";b.className="pchip";b.setAttribute("aria-pressed",p.k===chosen);
b.innerHTML=`<i style="background:${p.c};box-shadow:0 0 8px ${p.c}"></i>`;b.append(p.n);
b.onclick=()=>{chosen=p.k;[...$("planets").children].forEach(x=>x.setAttribute("aria-pressed","false"));b.setAttribute("aria-pressed","true")};$("planets").append(b)});

function status(id,t,err){const s=$(id);s.textContent=t;s.className="status"+(err?" err":"")}
function beam(){const b=$("beam");b.classList.remove("go");void b.offsetWidth;b.classList.add("go")}

/* tabs */
function route(){
  const h=location.hash.slice(1);
  document.body.classList.toggle("story",h==="stories");
  if(h==="stories"){startStory();return}
  stopStory();
  const t=["drinks","food","photos"].includes(h)?h:"gratitude";
  document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x.id==="tab-"+t));
  document.querySelectorAll(".tabs a").forEach(x=>x.classList.toggle("on",x.dataset.t===t));
}
addEventListener("hashchange",route);

/* render */
function renderGrats(){
  const w=$("wall");w.innerHTML="";$("gempty").style.display=grats.length?"none":"block";
  grats.forEach((g,i)=>{const p=P[g.planet]||P.earth;const c=document.createElement("article");c.className="card";c.style.setProperty("--c",p.c);c.style.animationDelay=Math.min(i*50,600)+"ms";
    const o=document.createElement("div");o.className="orb";const q=document.createElement("blockquote");q.textContent=g.message;
    const m=document.createElement("div");m.className="meta";const w1=document.createElement("div");w1.className="who";w1.textContent=g.agent;
    const w2=document.createElement("div");w2.className="from";w2.textContent="from "+p.n;m.append(w1,w2);c.append(o,q,m);w.append(c)});
  route();
}
const MC={drinks:["#ffb347","#d6456b","#6fe3d6"],food:["#ff7a3d","#ffd88a","#c48cff"]};
function renderMenu(){["drinks","food"].forEach(cat=>{const box=$("menu-"+cat);box.innerHTML="";const list=menu.filter(x=>x.category===cat);
  if(!list.length){const e=document.createElement("div");e.className="empty";e.textContent="Coming soon.";box.append(e);return}
  list.forEach((it,i)=>{const r=document.createElement("div");r.className="item";r.style.setProperty("--c",MC[cat][i%3]);
    const o=document.createElement("div");o.className="orb";const t=document.createElement("div");const n=document.createElement("div");n.className="nm";n.textContent=it.name;t.append(n);
    if(it.tags){const d=document.createElement("div");d.className="tg";d.textContent=it.tags;t.append(d)}
    if(it.note){const d=document.createElement("div");d.className="nt";d.textContent=it.note;t.append(d)}r.append(o,t);box.append(r)})})}
function renderPhotos(){const g=$("grid");g.innerHTML="";$("pempty").style.display=photos.length?"none":"block";
  photos.forEach(p=>{const d=document.createElement("div");d.className="ph";const im=document.createElement("img");im.loading="lazy";im.src=p.url;im.alt=p.caption||"";
    const s=document.createElement("span");s.textContent=p.agent;d.append(im,s);d.onclick=()=>{$("lbimg").src=p.url;$("lbcap").textContent=p.caption||"";$("lbwho").textContent=p.agent;$("lightbox").classList.add("on")};g.append(d)})}
$("lightbox").onclick=()=>$("lightbox").classList.remove("on");

/* story mode */
let si=0,stimer=null,story=[];
function showStory(){clearTimeout(stimer);
  if(!story.length){$("tvq").textContent="Waiting for the first signal…";$("tvwho").textContent="";$("bars").innerHTML="";$("tvcount").textContent="";return}
  si=(si+story.length)%story.length;const g=story[si],p=P[g.planet]||P.earth;
  $("bars").innerHTML=story.map((_,i)=>`<span class="${i<si?"done":i===si?"on":""}"><b></b></span>`).join("");
  $("tvq").classList.add("out");$("tvwho").classList.add("out");
  setTimeout(()=>{$("tvq").textContent="“"+g.message+"”";$("tvwho").textContent=g.agent+"  ·  from "+p.n;$("tvwho").style.color=p.c;
    $("tvorb").style.background=`radial-gradient(circle at 30% 30%,#fff9,${p.c} 45%,#0007 100%)`;$("tvorb").style.boxShadow=`0 0 40px ${p.c}`;
    $("tvq").classList.remove("out");$("tvwho").classList.remove("out")},350);
  $("tvcount").textContent=`${si+1} / ${story.length}`;stimer=setTimeout(()=>{si++;showStory()},7000)}
function startStory(){story=grats.slice().reverse();si=0;showStory()}
function stopStory(){clearTimeout(stimer);story=[]}
$("next").onclick=()=>{si++;showStory()};$("prev").onclick=()=>{si--;showStory()};
let sx=null;$("tv").addEventListener("touchstart",e=>{sx=e.touches[0].clientX},{passive:true});
$("tv").addEventListener("touchend",e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx;sx=null;if(Math.abs(dx)>50){si+=dx<0?1:-1;showStory()}});
addEventListener("resize",route);

renderMenu();renderGrats();renderPhotos();

/* ---------- Supabase ---------- */
const cfg=window.PARTY_CONFIG||{};
const ready=cfg.supabaseUrl&&cfg.supabaseKey&&!cfg.supabaseUrl.startsWith("PASTE")&&!cfg.supabaseKey.startsWith("PASTE");
if(!ready){$("setup").style.display="block";$("setup").textContent="Almost there: add your Supabase URL and key to config.js (see the setup guide).";}
const sb=ready?createClient(cfg.supabaseUrl,cfg.supabaseKey):null;

async function loadGrats(){const {data,error}=await sb.from("gratitudes").select("id,agent,planet,message,created_at").order("created_at",{ascending:false}).limit(500);if(!error){grats=data;renderGrats()}}
async function loadMenu(){const {data,error}=await sb.from("menu_items").select("id,category,name,tags,note,position").order("position").order("id");if(!error){menu=data;renderMenu()}}
async function loadPhotos(){const {data,error}=await sb.from("photos").select("id,agent,caption,path,created_at").order("created_at",{ascending:false}).limit(300);
  if(!error){photos=data.map(p=>({...p,url:sb.storage.from(BUCKET).getPublicUrl(p.path).data.publicUrl}));renderPhotos()}}

if(sb){
  loadGrats();loadMenu();loadPhotos();
  sb.channel("party")
    .on("postgres_changes",{event:"*",schema:"public",table:"gratitudes"},loadGrats)
    .on("postgres_changes",{event:"*",schema:"public",table:"menu_items"},loadMenu)
    .on("postgres_changes",{event:"*",schema:"public",table:"photos"},loadPhotos)
    .subscribe();
  setInterval(()=>{if(!document.hidden){loadGrats();loadPhotos()}},30000); // backup if live updates drop
}

$("gform").addEventListener("submit",async e=>{
  e.preventDefault();if(!sb)return status("gstatus","Site isn't connected yet.",true);
  const agent=$("agent").value.trim(),message=$("msg").value.trim();
  if(!agent||!message)return status("gstatus","Add a name and a message.",true);
  setAgent(agent);status("gstatus","Sending…");
  const {error}=await sb.from("gratitudes").insert({agent,planet:chosen,message});
  if(error)return status("gstatus","Didn't send. Try again.",true);
  beam();$("msg").value="";status("gstatus","✦ Sent! Thanks, "+agent+".");loadGrats();
});

/* photo upload (shrinks big phone photos first) */
let picked=null;
$("file").addEventListener("change",()=>{picked=$("file").files[0]||null;
  if(picked){$("preview").src=URL.createObjectURL(picked);$("preview").style.display="block";$("pickText").textContent="Change photo"}});
async function shrink(file){
  try{const bmp=await createImageBitmap(file);const s=Math.min(1,1600/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas");c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    const b=await new Promise(r=>c.toBlob(r,"image/jpeg",.82));return b?{blob:b,ext:"jpg",type:"image/jpeg"}:null}catch(e){return null}}
$("pform").addEventListener("submit",async e=>{
  e.preventDefault();if(!sb)return status("pstatus","Site isn't connected yet.",true);
  const agent=$("pagent").value.trim();if(!picked)return status("pstatus","Pick a photo first.",true);if(!agent)return status("pstatus","Add your agent name.",true);
  setAgent(agent);$("psend").disabled=true;status("pstatus","Uploading…");
  try{
    const small=await shrink(picked);
    const body=small?small.blob:picked,ext=small?small.ext:((picked.name.split(".").pop()||"jpg").toLowerCase()),type=small?small.type:picked.type;
    const path=`${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
    const up=await sb.storage.from(BUCKET).upload(path,body,{contentType:type,upsert:false});if(up.error)throw up.error;
    const {error}=await sb.from("photos").insert({agent,caption:$("caption").value.trim()||null,path});if(error)throw error;
    beam();picked=null;$("file").value="";$("caption").value="";$("preview").style.display="none";$("pickText").textContent="Add a photo";
    status("pstatus","✦ Uploaded!");loadPhotos();
  }catch(err){status("pstatus","Upload failed. Try again.",true)}
  finally{$("psend").disabled=false}
});
</script>
