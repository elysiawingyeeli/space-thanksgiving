<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Space Thanksgiving — Recap</title>
<meta name="description" content="Thank you for coming to Space Thanksgiving.">
<meta property="og:title" content="Space Thanksgiving — Recap">
<meta property="og:description" content="Thank you for coming to Space Thanksgiving.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://space-thanksgiving.vercel.app/recap">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--void:#000;--ink:#fff;--dim:#9a9aa2;--amber:#ffb347;--line:rgba(255,255,255,.16)}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--void);color:var(--ink);font-family:"Space Mono",monospace;min-height:100%}
  body{overflow-x:hidden}
  .topbar{max-width:920px;margin:0 auto;padding:12px 14px 0;display:flex;align-items:center;justify-content:space-between;font-size:11px;letter-spacing:.22em;text-transform:uppercase}
  .topbar a{color:var(--ink);text-decoration:none}
  .topbar a:hover{color:var(--amber)}
  .topbar span{color:var(--dim)}
  main{max-width:920px;margin:0 auto;padding:12px 14px 24px}
  #note{font-family:"Fraunces",serif;font-size:15px;line-height:1.65;color:#e8e8e8;text-align:center;max-width:560px;margin:0 auto}
  #note .sig{color:var(--amber)}
  .rule{height:1px;background:var(--line);margin:14px 0}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:640px){.grid{grid-template-columns:1fr}}
  .panel{border:1px solid var(--line);min-height:300px;position:relative;overflow:hidden;cursor:pointer}
  .panel .lbl{position:absolute;top:0;left:0;z-index:3;font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--dim);padding:10px 12px;background:rgba(0,0,0,.55)}
  /* messages */
  #msg{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:36px 16px 16px;transition:opacity .8s ease}
  #msg.fade{opacity:0}
  #msg .mi{padding:12px 0;border-top:1px solid var(--line)}
  #msg .mi:first-child{border-top:0;padding-top:0}
  #msg .q{font-family:"Fraunces",serif;font-size:17px;line-height:1.5}
  #msg .w{margin-top:8px;font-size:10px;letter-spacing:.24em;color:var(--amber);text-transform:uppercase}
  /* photos */
  #ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.1s ease}
  #ph img.on{opacity:1}
  #ph .cap{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:28px 12px 10px;background:linear-gradient(transparent,rgba(0,0,0,.9));font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#fff}
  .empty{color:var(--dim);font-size:12px;line-height:1.7;padding:60px 22px;text-align:center}
</style>
</head>
<body>
<header class="topbar"><a href="./">← Space Thanksgiving</a><span>Recap</span></header>
<main>
  <p id="note">thank you, dear friends, SO much for coming!!! 🤍<br>
  I&rsquo;m genuinely grateful for every single one of you and all the love you brought into the room 💛<br>
  love you all!! 🚀❤️<br>
  <span class="sig">— Elyse</span></p>
  <div class="rule"></div>
  <div class="grid">
    <div class="panel" id="msgpanel" title="Tap for the next messages">
      <div class="lbl">Messages</div>
      <div id="msg"><div class="empty">Loading messages…</div></div>
    </div>
    <div class="panel" id="ph" title="Tap for the next photo">
      <div class="lbl">Photos</div>
      <div class="empty" id="phempty">Loading photos…</div>
    </div>
  </div>
</main>

<script src="config.js"></script>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cfg=window.PARTY_CONFIG||{};
const sb=(cfg.supabaseUrl&&cfg.supabaseKey)?createClient(cfg.supabaseUrl,cfg.supabaseKey):null;

let grats=[],photos=[],mi=0,pi=0;

function showMsg(i){
  mi=((i%grats.length)+grats.length)%grats.length;
  const m=$("msg");
  m.classList.add("fade");
  setTimeout(()=>{
    let html="";
    for(let k=0;k<3&&k<grats.length;k++){
      const g=grats[(mi+k)%grats.length];
      html+=`<div class="mi"><div class="q">&ldquo;${esc(g.message)}&rdquo;</div><div class="w">${esc(g.agent)}</div></div>`;
    }
    m.innerHTML=html;
    m.classList.remove("fade");
  },450);
}
function showPhoto(i){
  pi=(i+photos.length)%photos.length;
  document.querySelectorAll("#ph img").forEach((im,j)=>im.classList.toggle("on",j===pi));
  const p=photos[pi],cap=document.querySelector("#ph .cap");
  if(cap)cap.textContent=`${p.agent}${p.caption?" · "+p.caption:""}`;
}

async function load(){
  if(!sb){$("msg").innerHTML='<div class="empty">Messages aren’t available right now.</div>';$("phempty").textContent="Photos aren’t available right now.";return}
  const [gr,ph]=await Promise.all([
    sb.from("gratitudes").select("id,agent,message,created_at").order("created_at",{ascending:true}).limit(500),
    sb.from("photos").select("id,agent,caption,path,created_at").order("created_at",{ascending:true}).limit(500)
  ]);
  grats=gr.data||[];
  photos=(ph.data||[]).map(p=>({...p,url:sb.storage.from("party-photos").getPublicUrl(p.path).data.publicUrl}));
  if(grats.length){showMsg(0);setInterval(()=>showMsg(mi+3),6000)}
  else $("msg").innerHTML='<div class="empty">No messages yet.</div>';
  const box=$("ph");
  if(photos.length){
    $("phempty").remove();
    photos.forEach((p,i)=>{const im=document.createElement("img");im.src=p.url;im.alt=p.caption||"";im.loading="lazy";if(i===0)im.classList.add("on");box.append(im)});
    const cap=document.createElement("div");cap.className="cap";box.append(cap);
    showPhoto(0);setInterval(()=>showPhoto(pi+1),6000);
  } else $("phempty").textContent="No photos yet.";
  $("msgpanel").onclick=()=>{if(grats.length)showMsg(mi+3)};
  $("ph").onclick=e=>{if(e.target.closest(".lbl"))return;if(photos.length)showPhoto(pi+1)};
}
load();
</script>
</body>
</html>
